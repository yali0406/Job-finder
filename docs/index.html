<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>המשרות שלי</title>
<style>
  :root {
    --bg: #f6f7f9; --card: #fff; --text: #1c2430; --muted: #667085; --line: #e4e7ec;
    --accent: #2563eb; --new: #16a34a; --new-bg: #ecfdf3; --warn: #b54708;
    --hi: #16a34a; --mid: #ca8a04; --lo: #98a2b3;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0f1218; --card: #171b23; --text: #e6e9ef; --muted: #98a2b3; --line: #2a303b;
      --accent: #60a5fa; --new: #4ade80; --new-bg: #13261b; --warn: #fbbf24;
      --hi: #4ade80; --mid: #facc15; --lo: #667085;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Arial, sans-serif; }
  header { padding: 20px 16px 8px; max-width: 980px; margin: 0 auto; }
  h1 { margin: 0 0 4px; font-size: 24px; }
  .sub { color: var(--muted); font-size: 13px; }
  .controls { max-width: 980px; margin: 0 auto; padding: 8px 16px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .controls input[type=search], .controls select { padding: 7px 10px; border: 1px solid var(--line);
    border-radius: 8px; background: var(--card); color: var(--text); font: inherit; }
  .controls input[type=search] { flex: 1 1 200px; }
  .chip { border: 1px solid var(--line); background: var(--card); color: var(--text); border-radius: 999px;
    padding: 5px 12px; cursor: pointer; font: inherit; font-size: 13px; }
  .chip[aria-pressed=true] { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn { border: 0; background: var(--accent); color: #fff; padding: 7px 14px; border-radius: 8px; cursor: pointer; font: inherit; }
  .summary { max-width: 980px; margin: 0 auto; padding: 4px 16px 0; color: var(--muted); font-size: 13px; }
  main { max-width: 980px; margin: 0 auto; padding: 8px 16px 40px; }
  .section-title { margin: 18px 0 8px; font-size: 15px; color: var(--muted); font-weight: 600; }
  .job { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px;
    margin-bottom: 8px; display: grid; grid-template-columns: 52px 1fr auto; gap: 12px; align-items: start; }
  .job.is-new { border-color: var(--new); background: linear-gradient(0deg, var(--card), var(--new-bg)); }
  .job.dim { opacity: .5; }
  .score { width: 52px; height: 52px; border-radius: 50%; display: grid; place-items: center; font-weight: 700;
    border: 3px solid var(--lo); font-size: 16px; }
  .score.hi { border-color: var(--hi); } .score.mid { border-color: var(--mid); }
  .title { font-weight: 600; font-size: 16px; color: var(--text); text-decoration: none; }
  .title:hover { text-decoration: underline; }
  .meta { color: var(--muted); font-size: 13px; margin-top: 2px; }
  .reason { font-size: 14px; margin-top: 6px; }
  .tag { display: inline-block; font-size: 12px; padding: 1px 8px; border-radius: 999px; border: 1px solid var(--line); margin-inline-start: 6px; }
  .tag.new { background: var(--new); color: #fff; border-color: var(--new); }
  .tag.broad { color: var(--warn); border-color: var(--warn); }
  .tag.opened { color: var(--accent); border-color: var(--accent); }
  .tag.unopened { color: var(--muted); border-style: dashed; }
  .tag.chick { background: #fff6cc; border-color: #f5c400; color: #6b5200; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .tag.chick { background: #3a3000; color: #ffe066; border-color: #a88600; } }
  .actions { display: flex; flex-direction: column; gap: 4px; }
  .actions button { border: 1px solid var(--line); background: transparent; color: var(--muted); border-radius: 6px;
    font-size: 12px; padding: 3px 8px; cursor: pointer; white-space: nowrap; }
  .actions button.on { color: var(--accent); border-color: var(--accent); }
  .pick { width: 17px; height: 17px; margin: 0 0 0 6px; vertical-align: -3px; cursor: pointer; accent-color: var(--accent); }
  .bulk { position: sticky; top: 0; z-index: 5; max-width: 980px; margin: 0 auto; padding: 8px 16px; display: none;
    gap: 8px; align-items: center; flex-wrap: wrap; background: var(--bg); border-bottom: 1px solid var(--line); }
  .bulk.on { display: flex; }
  .bulk button { border: 1px solid var(--line); background: var(--card); color: var(--text); border-radius: 8px; padding: 5px 10px; cursor: pointer; font: inherit; font-size: 13px; }
  .tag.opened, .tag.unopened { cursor: pointer; }
  .empty { color: var(--muted); padding: 30px 0; text-align: center; }
  @media (max-width: 560px) {
    .job { grid-template-columns: 44px 1fr; }
    .score { width: 44px; height: 44px; font-size: 14px; }
    .actions { grid-column: 1 / -1; flex-direction: row; flex-wrap: wrap; }
  }
</style>
</head>
<body>
<header>
  <h1>המשרות שלי</h1>
  <div class="sub" id="status">טוען…</div>
</header>

<div class="controls">
  <input type="search" id="q" placeholder="חיפוש לפי תפקיד או חברה">
  <select id="minScore" aria-label="ציון מינימלי">
    <option value="0">כל הציונים</option>
    <option value="40">40 ומעלה</option>
    <option value="60" selected>60 ומעלה</option>
    <option value="80">80 ומעלה</option>
  </select>
  <select id="view" aria-label="תצוגה">
    <option value="active">פעילות</option>
    <option value="saved">שמורות</option>
    <option value="applied">הגשתי</option>
    <option value="hidden">מוסתרות</option>
  </select>
  <select id="sort" aria-label="מיון">
    <option value="score">מיון: ציון גבוה לנמוך</option>
    <option value="scoreAsc">מיון: ציון נמוך לגבוה</option>
    <option value="newest">מיון: הכי חדשות</option>
    <option value="company">מיון: לפי חברה</option>
  </select>
  <select id="openedFilter" aria-label="נכנסתי">
    <option value="">נכנסתי ולא נכנסתי</option>
    <option value="no">רק לא נכנסתי</option>
    <option value="yes">רק נכנסתי</option>
  </select>
  <button class="chip" id="chickOnly" aria-pressed="false">🐣 רק סטארטאפים צעירים</button>
  <button class="btn" id="markSeen" title="כל המשרות הנוכחיות יפסיקו להיות מסומנות כחדשות">סמן הכל כנצפה</button>
</div>
<div class="controls" id="cats"></div>
<div class="summary" id="summary"></div>
<div class="bulk" id="bulk">
  <strong id="bulkCount"></strong>
  <button id="bulkOpened">👁 סמן כנכנסתי</button>
  <button id="bulkUnopened">סמן כלא נכנסתי</button>
  <button id="bulkAll">בחר את כל המוצגות</button>
  <button id="bulkClear">בטל בחירה</button>
</div>
<main id="list"></main>

<script>
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
};
let data = { jobs: [] };
// A "visit" is a session: reopening the page within 30 minutes keeps the same "new" markers,
// opening it later moves the "seen" point to the start of the previous visit.
let lastVisit = store.get("lastVisit", null);
(() => {
  const thisVisit = store.get("thisVisit", null);
  const now = new Date().toISOString();
  if (!thisVisit || Date.now() - Date.parse(thisVisit) > 30 * 60 * 1000) {
    if (thisVisit) { lastVisit = thisVisit; store.set("lastVisit", lastVisit); }
    store.set("thisVisit", now);
  }
})();
let marks = store.get("marks", {});             // id -> "saved" | "applied" | "hidden"
let activeCats = new Set(store.get("cats", []));
let chickOnly = false;
let opened = store.get("opened", {});           // id -> when the job link was first opened

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const fmt = (iso) => iso ? new Date(iso).toLocaleString("he-IL", { dateStyle: "short", timeStyle: "short" }) : "";
const isNew = (j) => !lastVisit || Date.parse(j.first_seen) > Date.parse(lastVisit);

function renderCats() {
  const cats = [...new Set(data.jobs.map(j => j.category).filter(Boolean))].sort();
  $("cats").innerHTML = cats.map(c =>
    `<button class="chip" data-cat="${esc(c)}" aria-pressed="${activeCats.has(c)}">${esc(c)}</button>`).join("");
  $("cats").querySelectorAll(".chip").forEach(b => b.onclick = () => {
    const c = b.dataset.cat;
    activeCats.has(c) ? activeCats.delete(c) : activeCats.add(c);
    store.set("cats", [...activeCats]);
    renderCats(); render();
  });
}

// Clicking the tag toggles it by hand.
const openedTag = (j) => opened[j.id]
  ? `<span class="tag opened" data-toggle="${j.id}" title="נפתח ב-${fmt(opened[j.id])} · לחיצה תסמן כלא נכנסתי">👁 נכנסתי</span>`
  : `<span class="tag unopened" data-toggle="${j.id}" title="לחיצה תסמן כנכנסתי">לא נכנסתי</span>`;
const picked = new Set();
let shown = [];

function setOpened(ids, on) {
  const now = new Date().toISOString();
  ids.forEach(id => on ? (opened[id] = opened[id] || now) : delete opened[id]);
  store.set("opened", opened);
}

function jobHtml(j) {
  const s = j.score ?? 0;
  const cls = s >= 75 ? "hi" : s >= 55 ? "mid" : "";
  const m = marks[j.id];
  return `<article class="job ${isNew(j) ? "is-new" : ""}">
    <div class="score ${cls}" title="ציון התאמה">${j.score ?? "–"}</div>
    <div>
      <input type="checkbox" class="pick" data-pick="${j.id}" ${picked.has(j.id) ? "checked" : ""} aria-label="בחירה">
      <a class="title" data-open="${j.id}" href="${esc(j.url)}" target="_blank" rel="noopener">${esc(j.title)}</a>
      ${j.broad === "early-stage startup" ? '<span class="tag chick" title="סטארטאפ בשלב מוקדם">🐣 סטארטאפ צעיר</span>' : ""}
      ${isNew(j) ? '<span class="tag new">חדש</span>' : ""}
      ${openedTag(j)}
      ${j.category ? `<span class="tag ${j.broad ? "broad" : ""}">${esc(j.category)}</span>` : ""}
      <div class="meta">${esc(j.company)} · ${esc(j.location)} · נמצא ${fmt(j.first_seen)} · ${esc(j.source)}</div>
      ${j.reason ? `<div class="reason">${esc(j.reason)}</div>` : ""}
    </div>
    <div class="actions">
      <button data-id="${j.id}" data-mark="saved" class="${m === "saved" ? "on" : ""}">${m === "saved" ? "שמור ✓" : "שמור"}</button>
      <button data-id="${j.id}" data-mark="applied" class="${m === "applied" ? "on" : ""}">${m === "applied" ? "הגשתי ✓" : "הגשתי"}</button>
      <button data-id="${j.id}" data-mark="hidden" class="${m === "hidden" ? "on" : ""}">${m === "hidden" ? "הסתר ✓" : "הסתר"}</button>
    </div>
  </article>`;
}

function render() {
  const q = $("q").value.trim().toLowerCase();
  const min = +$("minScore").value;
  const view = $("view").value;
  const jobs = data.jobs.filter(j => {
    const m = marks[j.id];
    if (view === "active" ? m === "hidden" : m !== view) return false;
    if ((j.score ?? 0) < min) return false;
    if (activeCats.size && !activeCats.has(j.category)) return false;
    if (chickOnly && j.broad !== "early-stage startup") return false;
    const of = $("openedFilter").value;
    if (of && (of === "yes") !== !!opened[j.id]) return false;
    if (q && !`${j.title} ${j.company} ${j.location}`.toLowerCase().includes(q)) return false;
    return true;
  });
  const sc = (j) => j.score ?? 0;
  const byScore = (a, b) => sc(b) - sc(a);
  const cmp = {
    score: byScore,
    scoreAsc: (a, b) => sc(a) - sc(b),
    newest: (a, b) => (b.first_seen || "").localeCompare(a.first_seen || "") || byScore(a, b),
    company: (a, b) => (a.company || "").localeCompare(b.company || "", "he") || byScore(a, b),
  }[$("sort").value] || byScore;
  store.set("sort", $("sort").value);
  const fresh = jobs.filter(isNew).sort(cmp);
  const older = jobs.filter(j => !isNew(j)).sort(cmp);

  $("summary").textContent = `${fresh.length} חדשות מאז הביקור הקודם · ${jobs.length} מוצגות מתוך ${data.jobs.length}`;
  let html = "";
  if (fresh.length) html += `<div class="section-title">חדש מאז ${lastVisit ? fmt(lastVisit) : "הביקור הראשון"}</div>` + fresh.map(jobHtml).join("");
  if (older.length) html += `<div class="section-title">כבר ראית</div>` + older.map(jobHtml).join("");
  $("list").innerHTML = html || `<div class="empty">אין משרות שמתאימות לסינון הנוכחי</div>`;
  // Left, middle or ctrl-click on the title all count as opening the job.
  $("list").querySelectorAll("a[data-open]").forEach(a => {
    const mark = (e) => {
      if (e.type === "auxclick" && e.button !== 1) return;
      const id = a.dataset.open;
      if (opened[id]) return;
      opened[id] = new Date().toISOString();
      store.set("opened", opened);
      const tag = a.parentElement.querySelector(".tag.unopened");
      if (tag) tag.outerHTML = openedTag({ id });
    };
    a.addEventListener("click", mark);
    a.addEventListener("auxclick", mark);
  });
  shown = jobs.map(j => j.id);
  $("list").querySelectorAll("[data-toggle]").forEach(t => t.onclick = () => {
    setOpened([t.dataset.toggle], !opened[t.dataset.toggle]);
    render();
  });
  $("list").querySelectorAll("[data-pick]").forEach(c => c.onchange = () => {
    c.checked ? picked.add(c.dataset.pick) : picked.delete(c.dataset.pick);
    renderBulk();
  });
  renderBulk();
  $("list").querySelectorAll("button[data-mark]").forEach(b => b.onclick = () => {
    const { id, mark } = b.dataset;
    marks[id] === mark ? delete marks[id] : (marks[id] = mark);
    store.set("marks", marks);
    render();
  });
}

$("markSeen").onclick = () => {
  lastVisit = data.updated || new Date().toISOString();
  store.set("lastVisit", lastVisit);
  render();
};
$("chickOnly").onclick = () => {
  chickOnly = !chickOnly;
  $("chickOnly").setAttribute("aria-pressed", chickOnly);
  render();
};
function renderBulk() {
  $("bulk").classList.toggle("on", picked.size > 0);
  $("bulkCount").textContent = `${picked.size} נבחרו`;
}
const bulkSet = (on) => { setOpened([...picked], on); picked.clear(); render(); };
$("bulkOpened").onclick = () => bulkSet(true);
$("bulkUnopened").onclick = () => bulkSet(false);
$("bulkAll").onclick = () => { shown.forEach(id => picked.add(id)); render(); };
$("bulkClear").onclick = () => { picked.clear(); render(); };

$("sort").value = store.get("sort", "score");
["q", "minScore", "view", "openedFilter", "sort"].forEach(id => $(id).addEventListener("input", render));

fetch("data/jobs.json", { cache: "no-store" })
  .then(r => r.ok ? r.json() : Promise.reject(r.status))
  .then(d => {
    data = d;
    $("status").textContent = `עודכן לאחרונה: ${fmt(d.updated)} · ${d.new_this_run ?? 0} משרות חדשות בסריקה האחרונה`;
    renderCats(); render();
  })
  .catch(() => { $("status").textContent = "עדיין אין נתונים. הסריקה הראשונה תרוץ בקרוב."; });
</script>
</body>
</html>

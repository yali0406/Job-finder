<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>המשרות שלי</title>
<style>
  :root {
    --bg: #f6f7f9; --card: #fff; --text: #1c2430; --muted: #667085; --line: #e4e7ec;
    --accent: #2563eb; --new: #16a34a; --new-bg: #ecfdf3; --warn: #b54708;
    --hi: #16a34a; --mid: #ca8a04; --lo: #98a2b3;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0f1218; --card: #171b23; --text: #e6e9ef; --muted: #98a2b3; --line: #2a303b;
      --accent: #60a5fa; --new: #4ade80; --new-bg: #13261b; --warn: #fbbf24;
      --hi: #4ade80; --mid: #facc15; --lo: #667085;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Arial, sans-serif; }
  header { padding: 20px 16px 8px; max-width: 980px; margin: 0 auto; }
  h1 { margin: 0 0 4px; font-size: 24px; }
  .sub { color: var(--muted); font-size: 13px; }
  .controls { max-width: 980px; margin: 0 auto; padding: 8px 16px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .controls input[type=search], .controls select { padding: 7px 10px; border: 1px solid var(--line);
    border-radius: 8px; background: var(--card); color: var(--text); font: inherit; }
  .controls input[type=search] { flex: 1 1 200px; }
  .chip { border: 1px solid var(--line); background: var(--card); color: var(--text); border-radius: 999px;
    padding: 5px 12px; cursor: pointer; font: inherit; font-size: 13px; }
  .chip[aria-pressed=true] { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn { border: 0; background: var(--accent); color: #fff; padding: 7px 14px; border-radius: 8px; cursor: pointer; font: inherit; }
  .summary { max-width: 980px; margin: 0 auto; padding: 4px 16px 0; color: var(--muted); font-size: 13px; }
  main { max-width: 980px; margin: 0 auto; padding: 8px 16px 40px; }
  .section-title { margin: 18px 0 8px; font-size: 15px; color: var(--muted); font-weight: 600; }
  .job { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px;
    margin-bottom: 8px; display: grid; grid-template-columns: 52px 1fr auto; gap: 12px; align-items: start; }
  .job.is-new { border-color: var(--new); background: linear-gradient(0deg, var(--card), var(--new-bg)); }
  .job.dim { opacity: .5; }
  .score { width: 52px; height: 52px; border-radius: 50%; display: grid; place-items: center; font-weight: 700;
    border: 3px solid var(--lo); font-size: 16px; }
  .score.hi { border-color: var(--hi); } .score.mid { border-color: var(--mid); }
  .title { font-weight: 600; font-size: 16px; color: var(--text); text-decoration: none; }
  .title:hover { text-decoration: underline; }
  .meta { color: var(--muted); font-size: 13px; margin-top: 2px; }
  .reason { font-size: 14px; margin-top: 6px; }
  .tag { display: inline-block; font-size: 12px; padding: 1px 8px; border-radius: 999px; border: 1px solid var(--line); margin-inline-start: 6px; }
  .tag.new { background: var(--new); color: #fff; border-color: var(--new); }
  .tag.broad { color: var(--warn); border-color: var(--warn); }
  .tag.opened { color: var(--accent); border-color: var(--accent); }
  .tag.unopened { color: var(--muted); border-style: dashed; }
  .tag.chick { background: #fff6cc; border-color: #f5c400; color: #6b5200; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .tag.chick { background: #3a3000; color: #ffe066; border-color: #a88600; } }
  .actions { display: flex; flex-direction: column; gap: 4px; }
  .actions button { border: 1px solid var(--line); background: transparent; color: var(--muted); border-radius: 6px;
    font-size: 12px; padding: 3px 8px; cursor: pointer; white-space: nowrap; }
  .actions button.on { color: var(--accent); border-color: var(--accent); }
  .pick { width: 17px; height: 17px; margin: 0 0 0 6px; vertical-align: -3px; cursor: pointer; accent-color: var(--accent); }
  .bulk { position: sticky; top: 0; z-index: 5; max-width: 980px; margin: 0 auto; padding: 8px 16px; display: none;
    gap: 8px; align-items: center; flex-wrap: wrap; background: var(--bg); border-bottom: 1px solid var(--line); }
  .bulk.on { display: flex; }
  .bulk button { border: 1px solid var(--line); background: var(--card); color: var(--text); border-radius: 8px; padding: 5px 10px; cursor: pointer; font: inherit; font-size: 13px; }
  .tag.opened, .tag.unopened { cursor: pointer; }
  .dash { max-width: 980px; margin: 0 auto; padding: 4px 16px 4px; }
  .dash-head { display: flex; align-items: center; justify-content: space-between; margin: 6px 0; }
  .dash-head h2 { margin: 0; font-size: 15px; color: var(--muted); font-weight: 600; }
  .dash-head button { border: 1px solid var(--line); background: var(--card); color: var(--muted); border-radius: 8px;
    padding: 3px 10px; cursor: pointer; font: inherit; font-size: 12px; }
  .dash.closed .dash-body { display: none; }
  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 8px; }
  .kpi { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; }
  .kpi .v { font-size: 24px; font-weight: 700; line-height: 1.2; font-variant-numeric: tabular-nums; }
  .kpi .l { color: var(--muted); font-size: 12px; }
  .panels { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 8px; }
  @media (max-width: 900px) { .panels { grid-template-columns: 1fr 1fr; } }
  @media (max-width: 560px) { .panels { grid-template-columns: 1fr; } }
  .panel { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; min-width: 0; }
  .panel h3 { margin: 0 0 8px; font-size: 13px; font-weight: 600; }
  .panel .hint { color: var(--muted); font-weight: 400; font-size: 12px; }
  .cols { display: flex; align-items: flex-end; gap: 2px; height: 180px; border-bottom: 1px solid var(--line); }
  .cols .c { flex: 1; display: flex; flex-direction: column; justify-content: flex-end; height: 100%; cursor: default; }
  .cols .c span { display: block; background: var(--accent); border-radius: 4px 4px 0 0; min-height: 0; }
  .cols .c:hover span { opacity: .75; }
  .cols-x { display: flex; justify-content: space-between; color: var(--muted); font-size: 11px; margin-top: 3px; }
  .hbars { display: grid; gap: 5px; }
  .hb { display: grid; grid-template-columns: minmax(60px, 60%) 1fr 22px; gap: 6px; align-items: center; font-size: 12px;
    background: none; border: 0; padding: 2px 0; color: var(--text); font: inherit; font-size: 12px; text-align: start; cursor: pointer; }
  .hb:hover .track span { opacity: .75; }
  .hb .n { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .hb .track { height: 10px; }
  .hb .track span { display: block; height: 100%; background: var(--accent); border-start-end-radius: 4px; border-end-end-radius: 4px; }
  .hb.on .n { color: var(--accent); font-weight: 600; }
  .hb .num { color: var(--muted); font-variant-numeric: tabular-nums; text-align: end; }
  .tip { position: fixed; z-index: 20; pointer-events: none; background: var(--text); color: var(--bg); font-size: 12px;
    padding: 4px 8px; border-radius: 6px; display: none; white-space: nowrap; }
  .sync-btn { float: inline-end; margin-top: 4px; border: 1px solid var(--line); background: var(--card); color: var(--text);
    border-radius: 8px; padding: 5px 12px; cursor: pointer; font: inherit; font-size: 13px; }
  .sync-panel { display: none; clear: both; margin-top: 10px; background: var(--card); border: 1px solid var(--line);
    border-radius: 12px; padding: 12px 14px; font-size: 14px; }
  .sync-panel.on { display: block; }
  .sync-panel .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 8px; }
  .sync-panel input { flex: 1 1 180px; padding: 7px 10px; border: 1px solid var(--line); border-radius: 8px;
    background: var(--bg); color: var(--text); font: inherit; letter-spacing: 1px; direction: ltr; }
  .sync-panel button { border: 1px solid var(--line); background: var(--bg); color: var(--text); border-radius: 8px;
    padding: 6px 12px; cursor: pointer; font: inherit; font-size: 13px; }
  .sync-panel button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .sync-code { font: 600 18px/1.4 ui-monospace, Menlo, Consolas, monospace; letter-spacing: 2px; direction: ltr; display: inline-block; }
  .sync-note { color: var(--muted); font-size: 13px; }
  .empty { color: var(--muted); padding: 30px 0; text-align: center; }
  @media (max-width: 560px) {
    .job { grid-template-columns: 44px 1fr; }
    .score { width: 44px; height: 44px; font-size: 14px; }
    .actions { grid-column: 1 / -1; flex-direction: row; flex-wrap: wrap; }
  }
</style>
</head>
<body>
<header>
  <button class="sync-btn" id="syncBtn">🔄 סנכרון</button>
  <h1>המשרות שלי</h1>
  <div class="sub" id="status">טוען…</div>
  <div class="sync-panel" id="syncPanel"></div>
</header>

<section class="dash" id="dash">
  <div class="dash-head"><h2>📊 דשבורד <span class="hint" id="dashScope"></span></h2><button id="dashToggle">הסתר</button></div>
  <div class="dash-body">
    <div class="kpis" id="kpis"></div>
    <div class="panels">
      <div class="panel"><h3>חדשות ב-14 ימים</h3><div class="cols" id="chartDays"></div><div class="cols-x" id="chartDaysX"></div></div>
      <div class="panel"><h3>לפי סוג תפקיד <span class="hint">· לחיצה מסננת</span></h3><div class="hbars" id="chartCats"></div></div>
      <div class="panel"><h3>חברות מובילות <span class="hint">· לחיצה מחפשת</span></h3><div class="hbars" id="chartCos"></div></div>
      <div class="panel"><h3>פיזור ציוני התאמה <span class="hint">· כל הציונים</span></h3><div class="hbars" id="chartScores"></div></div>
    </div>
  </div>
</section>
<div class="tip" id="tip"></div>

<div class="controls" id="sections">
  <button class="chip" data-section="il">🇮🇱 בישראל <span id="countIl"></span></button>
  <button class="chip" data-section="remote">🌍 מרחוק מחו״ל <span id="countRemote"></span></button>
</div>

<div class="controls">
  <input type="search" id="q" placeholder="חיפוש לפי תפקיד או חברה">
  <select id="minScore" aria-label="ציון מינימלי">
    <option value="0">כל הציונים</option>
    <option value="40">40 ומעלה</option>
    <option value="60" selected>60 ומעלה</option>
    <option value="80">80 ומעלה</option>
  </select>
  <select id="view" aria-label="תצוגה">
    <option value="active">פעילות</option>
    <option value="saved">שמורות</option>
    <option value="applied">הגשתי</option>
    <option value="hidden">מוסתרות</option>
  </select>
  <select id="sort" aria-label="מיון">
    <option value="score">מיון: ציון גבוה לנמוך</option>
    <option value="scoreAsc">מיון: ציון נמוך לגבוה</option>
    <option value="newest">מיון: הכי חדשות</option>
    <option value="company">מיון: לפי חברה</option>
  </select>
  <select id="openedFilter" aria-label="נכנסתי">
    <option value="">נכנסתי ולא נכנסתי</option>
    <option value="no">רק לא נכנסתי</option>
    <option value="yes">רק נכנסתי</option>
  </select>
  <button class="chip" id="chickOnly" aria-pressed="false">🐣 רק סטארטאפים צעירים</button>
  <button class="btn" id="markSeen" title="כל המשרות הנוכחיות יפסיקו להיות מסומנות כחדשות">סמן הכל כנצפה</button>
</div>
<div class="controls" id="cats"></div>
<div class="summary" id="summary"></div>
<div class="bulk" id="bulk">
  <strong id="bulkCount"></strong>
  <button id="bulkOpened">👁 סמן כנכנסתי</button>
  <button id="bulkUnopened">סמן כלא נכנסתי</button>
  <button id="bulkAll">בחר את כל המוצגות</button>
  <button id="bulkClear">בטל בחירה</button>
</div>
<main id="list"></main>

<script>
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
};
let data = { jobs: [] };
// A "visit" is a session: reopening the page within 30 minutes keeps the same "new" markers,
// opening it later moves the "seen" point to the start of the previous visit.
let lastVisit = store.get("lastVisit", null);
(() => {
  const thisVisit = store.get("thisVisit", null);
  const now = new Date().toISOString();
  if (!thisVisit || Date.now() - Date.parse(thisVisit) > 30 * 60 * 1000) {
    if (thisVisit) { lastVisit = thisVisit; store.set("lastVisit", lastVisit); }
    store.set("thisVisit", now);
  }
})();
let marks = store.get("marks", {});             // id -> "saved" | "applied" | "hidden"
let activeCats = new Set(store.get("cats", []));
let chickOnly = false;
let section = store.get("section", "il");  // "il" = jobs in Israel, "remote" = fully remote at companies abroad
let opened = store.get("opened", {});           // id -> when the job link was first opened

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const fmt = (iso) => iso ? new Date(iso).toLocaleString("he-IL", { dateStyle: "short", timeStyle: "short" }) : "";
const isNew = (j) => !lastVisit || Date.parse(j.first_seen) > Date.parse(lastVisit);
// Every job ever listed (data/archive.json), so a mark outlives the listing: a job that closed, aged out,
// or came back under another id (same company + title, e.g. a VC-board copy replacing the LinkedIn one).
let archive = {};
const norm = (s) => String(s || "").toLowerCase().replace(/[^a-z0-9\u0590-\u05ff]+/g, "");
const keyOf = (j) => norm(j.company) + "|" + norm(j.title);
let markByKey = {};
function indexMarks() {
  const byId = Object.fromEntries(data.jobs.map(j => [j.id, j]));
  markByKey = {};
  for (const [id, m] of Object.entries(marks)) {
    const info = byId[id] || archive[id];
    if (info) markByKey[keyOf(info)] = m;
  }
}
const markOf = (j) => marks[j.id] || markByKey[keyOf(j)];
function setMark(j, mark) {
  const k = keyOf(j), off = markOf(j) === mark, before = { ...marks };
  for (const id of Object.keys(marks)) {  // clear every id this job has had, then set the new mark once
    const info = data.jobs.find(x => x.id === id) || archive[id];
    if (id === j.id || (info && keyOf(info) === k)) delete marks[id];
  }
  const changed = [j.id];
  for (const id of Object.keys(before)) if (!(id in marks)) changed.push(id);
  if (!off) marks[j.id] = mark;
  store.set("marks", marks);
  indexMarks();
  touched(changed);
}
// Marked jobs (saved / applied / hidden) that are no longer on the site, from the archive.
function goneMarked(view) {
  const live = new Set(data.jobs.map(keyOf));
  const ids = new Set(data.jobs.map(j => j.id));
  const out = [], seen = new Set();
  let unknown = 0;
  for (const [id, m] of Object.entries(marks)) {
    if (m !== view || ids.has(id)) continue;
    const info = archive[id];
    if (!info) { unknown++; continue; }
    const k = keyOf(info);
    if (live.has(k) || seen.has(k)) continue;
    seen.add(k);
    out.push({ ...info, id, gone: true });
  }
  return { out, unknown };
}

function renderCats() {
  const cats = [...new Set(data.jobs.map(j => j.category).filter(Boolean))].sort();
  $("cats").innerHTML = cats.map(c =>
    `<button class="chip" data-cat="${esc(c)}" aria-pressed="${activeCats.has(c)}">${esc(c)}</button>`).join("");
  $("cats").querySelectorAll(".chip").forEach(b => b.onclick = () => {
    const c = b.dataset.cat;
    activeCats.has(c) ? activeCats.delete(c) : activeCats.add(c);
    store.set("cats", [...activeCats]);
    renderCats(); render();
  });
}

// Clicking the tag toggles it by hand.
const openedTag = (j) => opened[j.id]
  ? `<span class="tag opened" data-toggle="${j.id}" title="נפתח ב-${fmt(opened[j.id])} · לחיצה תסמן כלא נכנסתי">👁 נכנסתי</span>`
  : `<span class="tag unopened" data-toggle="${j.id}" title="לחיצה תסמן כנכנסתי">לא נכנסתי</span>`;
const picked = new Set();
let shown = [];

function setOpened(ids, on) {
  const now = new Date().toISOString();
  ids.forEach(id => on ? (opened[id] = opened[id] || now) : delete opened[id]);
  store.set("opened", opened);
  touched(ids);
}

function jobHtml(j) {
  const s = j.score ?? 0;
  const cls = s >= 75 ? "hi" : s >= 55 ? "mid" : "";
  const m = markOf(j);
  return `<article class="job ${isNew(j) ? "is-new" : ""}">
    <div class="score ${cls}" title="ציון התאמה">${j.score ?? "–"}</div>
    <div>
      <input type="checkbox" class="pick" data-pick="${j.id}" ${picked.has(j.id) ? "checked" : ""} aria-label="בחירה">
      <a class="title" data-open="${j.id}" href="${esc(j.url)}" target="_blank" rel="noopener">${esc(j.title)}</a>
      ${j.broad === "early-stage startup" ? '<span class="tag chick" title="סטארטאפ בשלב מוקדם">🐣 סטארטאפ צעיר</span>' : ""}
      ${j.remote ? '<span class="tag" title="עבודה מלאה מרחוק מישראל">🌍 מרחוק</span>' : ""}
      ${j.gone ? '<span class="tag" title="המשרה כבר לא מופיעה בסריקה (נסגרה או ישנה)">ירדה מהאתר</span>' : isNew(j) ? '<span class="tag new">חדש</span>' : ""}
      ${openedTag(j)}
      ${j.category ? `<span class="tag ${j.broad ? "broad" : ""}">${esc(j.category)}</span>` : ""}
      <div class="meta">${esc(j.company)} · ${esc(j.location)} · נמצא ${fmt(j.first_seen)}${j.source ? " · " + esc(j.source) : ""}</div>
      ${j.reason ? `<div class="reason">${esc(j.reason)}</div>` : ""}
    </div>
    <div class="actions">
      <button data-id="${j.id}" data-mark="saved" class="${m === "saved" ? "on" : ""}">${m === "saved" ? "שמור ✓" : "שמור"}</button>
      <button data-id="${j.id}" data-mark="applied" class="${m === "applied" ? "on" : ""}">${m === "applied" ? "הגשתי ✓" : "הגשתי"}</button>
      <button data-id="${j.id}" data-mark="hidden" class="${m === "hidden" ? "on" : ""}">${m === "hidden" ? "הסתר ✓" : "הסתר"}</button>
    </div>
  </article>`;
}

function render() {
  const q = $("q").value.trim().toLowerCase();
  const min = +$("minScore").value;
  const view = $("view").value;
  const marked = view !== "active";  // saved / applied / hidden show every marked job, whatever the other filters
  const gone = marked ? goneMarked(view) : { out: [], unknown: 0 };
  const jobs = data.jobs.concat(gone.out).filter(j => {
    const m = markOf(j);
    if (view === "active" ? m === "hidden" : m !== view) return false;
    if (!marked && (j.score ?? 0) < min) return false;
    if (!marked && activeCats.size && !activeCats.has(j.category)) return false;
    if (!marked && (section === "remote") !== !!j.remote) return false;
    if (chickOnly && j.broad !== "early-stage startup") return false;
    const of = $("openedFilter").value;
    if (of && (of === "yes") !== !!opened[j.id]) return false;
    if (q && !`${j.title} ${j.company} ${j.location}`.toLowerCase().includes(q)) return false;
    return true;
  });
  const sc = (j) => j.score ?? 0;
  const byScore = (a, b) => sc(b) - sc(a);
  const cmp = {
    score: byScore,
    scoreAsc: (a, b) => sc(a) - sc(b),
    newest: (a, b) => (b.first_seen || "").localeCompare(a.first_seen || "") || byScore(a, b),
    company: (a, b) => (a.company || "").localeCompare(b.company || "", "he") || byScore(a, b),
  }[$("sort").value] || byScore;
  store.set("sort", $("sort").value);
  const fresh = marked ? [] : jobs.filter(isNew).sort(cmp);
  const older = marked ? jobs.sort(cmp) : jobs.filter(j => !isNew(j)).sort(cmp);

  renderDash();
  $("summary").textContent = marked
    ? `${jobs.length} משרות${gone.out.length ? ` (${gone.out.length} מהן כבר ירדו מהאתר)` : ""}${gone.unknown ? ` · עוד ${gone.unknown} סומנו במשרות ישנות שאין עליהן פרטים` : ""}`
    : `${fresh.length} חדשות מאז הביקור הקודם · ${jobs.length} מוצגות מתוך ${data.jobs.length}`;
  let html = "";
  if (fresh.length) html += `<div class="section-title">חדש מאז ${lastVisit ? fmt(lastVisit) : "הביקור הראשון"}</div>` + fresh.map(jobHtml).join("");
  if (older.length) html += (marked ? "" : `<div class="section-title">כבר ראית</div>`) + older.map(jobHtml).join("");
  $("list").innerHTML = html || `<div class="empty">אין משרות שמתאימות לסינון הנוכחי</div>`;
  // Left, middle or ctrl-click on the title all count as opening the job.
  $("list").querySelectorAll("a[data-open]").forEach(a => {
    const mark = (e) => {
      if (e.type === "auxclick" && e.button !== 1) return;
      const id = a.dataset.open;
      if (opened[id]) return;
      opened[id] = new Date().toISOString();
      store.set("opened", opened);
      touched([id]);
      const tag = a.parentElement.querySelector(".tag.unopened");
      if (tag) tag.outerHTML = openedTag({ id });
    };
    a.addEventListener("click", mark);
    a.addEventListener("auxclick", mark);
  });
  shown = jobs.map(j => j.id);
  $("list").querySelectorAll("[data-toggle]").forEach(t => t.onclick = () => {
    setOpened([t.dataset.toggle], !opened[t.dataset.toggle]);
    render();
  });
  $("list").querySelectorAll("[data-pick]").forEach(c => c.onchange = () => {
    c.checked ? picked.add(c.dataset.pick) : picked.delete(c.dataset.pick);
    renderBulk();
  });
  renderBulk();
  $("list").querySelectorAll("button[data-mark]").forEach(b => b.onclick = () => {
    const { id, mark } = b.dataset;
    const j = data.jobs.find(x => x.id === id) || { id, ...(archive[id] || {}) };
    setMark(j, mark);
    render();
  });
}

// ---- Dashboard: stats for the current section (Israel / remote) at the chosen minimum score ----
const tip = $("tip");
function bindTips(root) {
  root.querySelectorAll("[data-tip]").forEach(el => {
    el.onmousemove = (e) => { tip.textContent = el.dataset.tip; tip.style.display = "block";
      tip.style.left = Math.min(e.clientX + 12, innerWidth - tip.offsetWidth - 8) + "px"; tip.style.top = (e.clientY - 34) + "px"; };
    el.onmouseleave = () => { tip.style.display = "none"; };
  });
}
const hbars = (rows, max, onAttr) => rows.map(([name, n, on]) =>
  `<button class="hb ${on ? "on" : ""}" ${onAttr(name)} data-tip="${esc(name)}: ${n}">
    <span class="n">${esc(name)}</span><span class="track"><span style="width:${max ? Math.max(2, n / max * 100) : 0}%"></span></span><span class="num">${n}</span></button>`).join("");

function renderDash() {
  const min = +$("minScore").value;
  const inSec = data.jobs.filter(j => (section === "remote") === !!j.remote);
  const live = inSec.filter(j => markOf(j) !== "hidden");
  const good = live.filter(j => (j.score ?? 0) >= min);
  const day = 864e5, now = Date.now();
  const since = (ms) => good.filter(j => now - Date.parse(j.first_seen) < ms).length;
  const today = new Date(); today.setHours(0, 0, 0, 0);
  const avg = good.length ? Math.round(good.reduce((a, j) => a + (j.score ?? 0), 0) / good.length) : 0;
  // saved / applied count every marked job, in both sections and including ones no longer listed
  const cnt = (m) => { const ks = new Set(); let n = 0;
    for (const [id, v] of Object.entries(marks)) { if (v !== m) continue;
      const info = data.jobs.find(x => x.id === id) || archive[id];
      if (!info) { n++; continue; } ks.add(keyOf(info)); }
    return ks.size + n; };
  $("dashScope").textContent = `· ${section === "remote" ? "מרחוק מחו״ל" : "בישראל"} · ציון ${min}+`;
  const kpis = [
    [good.length, "משרות מתאימות"],
    [good.filter(j => Date.parse(j.first_seen) >= today.getTime()).length, "חדשות היום"],
    [since(7 * day), "חדשות ב-7 ימים"],
    [avg || "–", "ציון ממוצע"],
    [good.filter(j => !opened[j.id]).length, "עוד לא נכנסתי"],
    [cnt("saved"), "שמורות"],
    [cnt("applied"), "הגשתי"],
  ];
  $("kpis").innerHTML = kpis.map(([v, l]) => `<div class="kpi"><div class="v">${v}</div><div class="l">${l}</div></div>`).join("");

  // new jobs per day, last 14 days
  const days = [...Array(14)].map((_, i) => { const d = new Date(today.getTime() - (13 - i) * day); return d; });
  const perDay = days.map(d => good.filter(j => { const t = Date.parse(j.first_seen); return t >= d.getTime() && t < d.getTime() + day; }).length);
  const maxD = Math.max(1, ...perDay);
  const dl = (d) => d.toLocaleDateString("he-IL", { day: "numeric", month: "numeric" });
  $("chartDays").innerHTML = perDay.map((n, i) =>
    `<div class="c" data-tip="${dl(days[i])}: ${n} משרות"><span style="height:${n / maxD * 100}%"></span></div>`).join("");
  $("chartDaysX").innerHTML = `<span>${dl(days[0])}</span><span>${dl(days[7])}</span><span>היום</span>`;

  const tally = (key) => { const m = {}; good.forEach(j => { const k = key(j); if (k) m[k] = (m[k] || 0) + 1; }); return Object.entries(m).sort((a, b) => b[1] - a[1]); };
  const cats = tally(j => j.category).slice(0, 8);
  $("chartCats").innerHTML = hbars(cats.map(([c, n]) => [c, n, activeCats.has(c)]), cats[0]?.[1], c => `data-dcat="${esc(c)}"`) || '<div class="hint">אין נתונים</div>';
  const cos = tally(j => j.company).slice(0, 8);
  const q = $("q").value.trim().toLowerCase();
  $("chartCos").innerHTML = hbars(cos.map(([c, n]) => [c, n, q && c.toLowerCase() === q]), cos[0]?.[1], c => `data-dco="${esc(c)}"`) || '<div class="hint">אין נתונים</div>';

  const bins = [[80, 101, "80–100"], [60, 80, "60–79"], [40, 60, "40–59"], [0, 40, "מתחת ל-40"]];
  const sb = bins.map(([a, b, l]) => [l, live.filter(j => (j.score ?? 0) >= a && (j.score ?? 0) < b).length, min >= a && min < b]);
  $("chartScores").innerHTML = hbars(sb, Math.max(...sb.map(r => r[1])), l => `data-dscore="${bins.find(b => b[2] === l)[0]}"`);

  document.querySelectorAll("[data-dcat]").forEach(b => b.onclick = () => {
    const c = b.dataset.dcat; activeCats.has(c) ? activeCats.delete(c) : activeCats.add(c);
    store.set("cats", [...activeCats]); renderCats(); render();
  });
  document.querySelectorAll("[data-dco]").forEach(b => b.onclick = () => {
    $("q").value = $("q").value.trim().toLowerCase() === b.dataset.dco.toLowerCase() ? "" : b.dataset.dco; render();
  });
  document.querySelectorAll("[data-dscore]").forEach(b => b.onclick = () => {
    const v = b.dataset.dscore; if ([...$("minScore").options].some(o => o.value === v)) { $("minScore").value = v; render(); }
  });
  bindTips($("dash"));
}
let dashOpen = store.get("dashOpen", true);
const applyDash = () => { $("dash").classList.toggle("closed", !dashOpen); $("dashToggle").textContent = dashOpen ? "הסתר" : "הצג"; };
$("dashToggle").onclick = () => { dashOpen = !dashOpen; store.set("dashOpen", dashOpen); applyDash(); };
applyDash();

$("markSeen").onclick = () => {
  lastVisit = data.updated || new Date().toISOString();
  store.set("lastVisit", lastVisit);
  render();
};
function renderSections() {
  document.querySelectorAll("[data-section]").forEach(b => b.setAttribute("aria-pressed", b.dataset.section === section));
  $("countIl").textContent = `(${data.jobs.filter(j => !j.remote).length})`;
  $("countRemote").textContent = `(${data.jobs.filter(j => j.remote).length})`;
}
document.querySelectorAll("[data-section]").forEach(b => b.onclick = () => {
  section = b.dataset.section;
  store.set("section", section);
  renderSections(); render();
});
$("chickOnly").onclick = () => {
  chickOnly = !chickOnly;
  $("chickOnly").setAttribute("aria-pressed", chickOnly);
  render();
};
function renderBulk() {
  $("bulk").classList.toggle("on", picked.size > 0);
  $("bulkCount").textContent = `${picked.size} נבחרו`;
}
const bulkSet = (on) => { setOpened([...picked], on); picked.clear(); render(); };
$("bulkOpened").onclick = () => bulkSet(true);
$("bulkUnopened").onclick = () => bulkSet(false);
$("bulkAll").onclick = () => { shown.forEach(id => picked.add(id)); render(); };
$("bulkClear").onclick = () => { picked.clear(); render(); };

$("sort").value = store.get("sort", "score");
["q", "minScore", "view", "openedFilter", "sort"].forEach(id => $(id).addEventListener("input", render));

// ---- Sync between devices: marks and "opened" go to /api/sync under a shared code ----
let syncCode = store.get("syncCode", "");
// A link from another device (#sync=CODE) joins its marks; otherwise every device gets its own code,
// so syncing is always on and connecting a second device is just opening a link.
{
  const m = location.hash.match(/sync=([A-Za-z0-9-]{16,80})/);
  if (m) {
    syncCode = m[1].toUpperCase().replace(/[^A-Z0-9]/g, "");
    store.set("syncCode", syncCode);
    history.replaceState(null, "", location.pathname + location.search);
  }
}
let changedAt = store.get("changedAt", {});   // id -> when this device last changed the job's mark / opened
let lastSync = store.get("lastSync", "");
let syncState = "";                            // "", "busy", "ok", "error"
let syncTimer = null;
function touched(ids) {
  const now = new Date().toISOString();
  ids.forEach(id => changedAt[id] = now);
  store.set("changedAt", changedAt);
  if (syncCode) { clearTimeout(syncTimer); syncTimer = setTimeout(syncNow, 1500); }
}
async function api(method, body) {
  const r = await fetch("api/sync", { method, headers: { "x-sync-code": syncCode, "content-type": "application/json" },
    body: body ? JSON.stringify(body) : undefined, cache: "no-store" });
  if (!r.ok) throw new Error("sync " + r.status);
  return r.json();
}
async function syncNow() {
  if (!syncCode || syncState === "busy") return;
  syncState = "busy"; renderSync();
  try {
    const server = {};
    (await api("GET")).marks.forEach(r => server[r.job_id] = r);
    let changed = false;
    // newer on the server: take it
    for (const [id, r] of Object.entries(server)) {
      if ((changedAt[id] || "") >= r.updated_at) continue;
      r.status ? (marks[id] = r.status) : delete marks[id];
      r.opened_at ? (opened[id] = r.opened_at) : delete opened[id];
      changedAt[id] = r.updated_at;
      changed = true;
    }
    // newer here (or never sent): send it
    const ids = new Set([...Object.keys(marks), ...Object.keys(opened), ...Object.keys(changedAt)]);
    const updates = [];
    for (const id of ids) {
      const r = server[id], at = changedAt[id] || "1970-01-01T00:00:00.000Z";
      if (r && r.updated_at >= at) continue;
      if (!r && !marks[id] && !opened[id]) continue;
      updates.push({ job_id: id, status: marks[id] || null, opened_at: opened[id] || null,
                     updated_at: changedAt[id] || new Date().toISOString() });
    }
    if (updates.length) await api("POST", { updates });
    store.set("marks", marks); store.set("opened", opened); store.set("changedAt", changedAt);
    lastSync = new Date().toISOString(); store.set("lastSync", lastSync);
    syncState = "ok";
    if (changed && data.jobs.length) { indexMarks(); render(); }
  } catch (e) {
    syncState = "error";
  }
  renderSync();
}
function newCode() {
  const abc = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789", b = crypto.getRandomValues(new Uint8Array(20));
  return [...b].map(x => abc[x % abc.length]).join("");
}
const pretty = (c) => c.replace(/(.{4})(?=.)/g, "$1-");
let panelOpen = false;
function renderSync() {
  const st = { busy: "מסנכרן…", ok: `מסונכרן ✓ ${lastSync ? fmt(lastSync) : ""}`, error: "⚠️ הסנכרון נכשל, ננסה שוב" }[syncState] || "";
  $("syncBtn").textContent = syncCode ? (syncState === "error" ? "⚠️ סנכרון" : "🔄 מסונכרן") : "🔄 סנכרון";
  $("syncPanel").classList.toggle("on", panelOpen);
  if (!panelOpen) return;
  $("syncPanel").innerHTML = syncCode ? `
    <div>הסימונים נשמרים אוטומטית. כדי לחבר מכשיר נוסף (למשל הטלפון), שלח לעצמך את הקישור ופתח אותו שם פעם אחת:</div>
    <div class="row"><button class="primary" id="syncShare">שלח קישור למכשיר אחר</button><button id="syncCopy">העתק קישור</button><span class="sync-note" id="syncMsg"></span></div>
    <details style="margin-top:8px"><summary class="sync-note">קוד ידני / חיבור לקוד אחר</summary>
      <div class="row"><span class="sync-code">${esc(pretty(syncCode))}</span></div>
      <div class="row"><input id="syncInput" placeholder="הכנס קוד ממכשיר אחר" autocomplete="off" autocapitalize="characters">
        <button id="syncJoin">חבר</button></div></details>
    <div class="row"><span class="sync-note">${esc(st)}</span><button id="syncGo">סנכרן עכשיו</button><button id="syncOff">נתק את המכשיר</button></div>
    <div class="sync-note" style="margin-top:6px">שמור על הקישור לעצמך: מי שיש לו אותו רואה ומשנה את הסימונים שלך.</div>` : `
    <div>סנכרון שומר את "שמור", "הגשתי", "הסתר" ו"נכנסתי" בין המחשב לטלפון.</div>
    <div class="row"><button class="primary" id="syncCreate">צור קוד חדש (במכשיר הראשון)</button></div>
    <div class="row"><input id="syncInput" placeholder="או הכנס קוד ממכשיר אחר" autocomplete="off" autocapitalize="characters">
      <button class="primary" id="syncJoin">חבר</button></div>
    <div class="sync-note" id="syncMsg"></div>`;
  const on = (id, fn) => { const el = $(id); if (el) el.onclick = fn; };
  on("syncCreate", () => { syncCode = newCode(); store.set("syncCode", syncCode); syncNow(); renderSync(); });
  on("syncJoin", async () => {
    const c = ($("syncInput").value || "").toUpperCase().replace(/[^A-Z0-9]/g, "");
    if (c.length < 16) { copied = "הקוד קצר מדי. העתק אותו בדיוק כמו שהוא מופיע במכשיר השני."; return; }
    const old = syncCode; syncCode = c;
    try {
      const got = await api("GET");
      if (!got.marks.length) { copied("לא נמצאו סימונים לקוד הזה. בדוק שהעתקת אותו נכון."); syncCode = old; return; }
    } catch { copied("לא הצלחתי להתחבר לשרת. נסה שוב בעוד רגע."); syncCode = old; return; }
    store.set("syncCode", syncCode); syncNow(); renderSync();
  });
  const link = () => location.origin + location.pathname + "#sync=" + syncCode;
  const copied = (t) => { const el = $("syncMsg"); if (el) el.textContent = t; };
  on("syncCopy", () => navigator.clipboard?.writeText(link()).then(() => copied("הקישור הועתק ✓")));
  on("syncShare", () => navigator.share
    ? navigator.share({ title: "סנכרון משרות", url: link() }).catch(() => {})
    : navigator.clipboard?.writeText(link()).then(() => copied("הקישור הועתק ✓, שלח אותו לעצמך")));
  on("syncGo", syncNow);
  on("syncOff", () => { syncCode = newCode(); store.set("syncCode", syncCode); syncNow(); renderSync(); });
}
$("syncBtn").onclick = () => { panelOpen = !panelOpen; renderSync(); };
if (!syncCode) { syncCode = newCode(); store.set("syncCode", syncCode); }
renderSync();
syncNow();
setInterval(() => { if (!document.hidden) syncNow(); }, 120000);
document.addEventListener("visibilitychange", () => { if (!document.hidden && syncCode) syncNow(); });

fetch("data/jobs.json", { cache: "no-store" })
  .then(r => r.ok ? r.json() : Promise.reject(r.status))
  .then(d => {
    data = d;
    indexMarks();
    $("status").textContent = `עודכן לאחרונה: ${fmt(d.updated)} · ${d.new_this_run ?? 0} משרות חדשות בסריקה האחרונה`;
    renderSections(); renderCats(); render();
  })
  .catch(() => { $("status").textContent = "עדיין אין נתונים. הסריקה הראשונה תרוץ בקרוב."; });
fetch("data/archive.json", { cache: "no-store" })
  .then(r => r.ok ? r.json() : {})
  .then(a => { archive = a || {}; if (data.jobs.length) { indexMarks(); render(); } })
  .catch(() => {});
</script>
</body>

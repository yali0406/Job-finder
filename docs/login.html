<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>כניסה · המשרות שלי</title>
<style>
  :root { --bg: #f6f7f9; --card: #fff; --text: #1c2430; --muted: #667085; --line: #e4e7ec; --accent: #2563eb; --warn: #b54708; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0f1218; --card: #171b23; --text: #e6e9ef; --muted: #98a2b3; --line: #2a303b; --accent: #60a5fa; --warn: #fbbf24; }
  }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--text);
    font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Arial, sans-serif; padding: 16px; box-sizing: border-box; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 28px 24px; max-width: 360px; width: 100%; text-align: center; }
  h1 { margin: 0 0 6px; font-size: 22px; }
  p { color: var(--muted); margin: 0 0 20px; }
  a.google { display: inline-flex; gap: 10px; align-items: center; justify-content: center; width: 100%; box-sizing: border-box;
    padding: 10px 14px; border-radius: 8px; border: 1px solid var(--line); background: var(--card); color: var(--text);
    text-decoration: none; font-weight: 600; }
  a.google:hover { border-color: var(--accent); }
  .error { color: var(--warn); margin-top: 16px; font-size: 14px; }
</style>
</head>
<body>
  <div class="card">
    <h1>המשרות שלי</h1>
    <p>משרות שמתאימות לקורות החיים שלך, מתעדכן כל שעה.</p>
    <a class="google" href="/api/auth/login">
      <svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-7.9l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"/></svg>
      כניסה עם Google
    </a>
    <div class="error" id="error"></div>
  </div>
<script>
  const reasons = {
    not_invited: "המייל הזה עוד לא הוזמן. בקש ממנהל האתר להוסיף אותך.",
    email: "לא הצלחנו לאמת את כתובת המייל בחשבון Google.",
    state: "הכניסה נקטעה באמצע. נסה שוב.",
    google: "Google לא אישר את הכניסה. נסה שוב.",
  };
  const e = new URLSearchParams(location.search).get("error");
  if (e) document.getElementById("error").textContent = reasons[e] || "הכניסה נכשלה. נסה שוב.";
</script>
</body>
</html>

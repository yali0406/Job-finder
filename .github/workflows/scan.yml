name: scan jobs

on:
  # Triggered hourly (07:17-00:17 Israel time) by the Cloudflare Worker in cloudflare/worker.js;
  # GitHub's own schedule fired only every few hours.
  workflow_dispatch:
    inputs:
      linkedin:
        description: "Scan LinkedIn this run (auto = every 3 hours)"
        default: auto
        type: choice
        options: [auto, "yes", "no"]

permissions:
  contents: write

concurrency:
  group: scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Scan
        id: scan
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CANDIDATE_PROFILE: ${{ secrets.CANDIDATE_PROFILE }}
          CLAUDE_MODEL: claude-haiku-5-5
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}
          SITE_URL: https://job-finder-d29.pages.dev
        run: python -m scanner.main --linkedin "${{ inputs.linkedin || 'auto' }}"
      - name: Commit results
        run: |
          git config user.name "job-scanner"
          git config user.email "job-scanner@users.noreply.github.com"
          git add docs/data
          git diff --cached --quiet || git commit -m "scan $(date -u +%Y-%m-%dT%H:%MZ)"
          # main may have moved while scanning (config edits); rebase and retry instead of failing
          for i in 1 2 3; do git push && break; git pull --rebase -X theirs origin main; done
      # Cloudflare Pages project is not connected to git, so hourly data commits don't trigger
      # builds; we upload the site and its API directly, and only when something new was found.
      - name: Deploy site
        if: steps.scan.outputs.new_jobs != '0' || github.event_name == 'workflow_dispatch'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
        run: cloudflare/deploy.sh

name: discover job boards

# Weekly: find companies on Greenhouse / Ashby / Lever with openings in Israel (scanner/discover.py).
on:
  schedule:
    - cron: "30 2 * * 0"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scan
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m scanner.discover
      - name: Commit results
        run: |
          git config user.name "job-scanner"
          git config user.email "job-scanner@users.noreply.github.com"
          git add discovered_boards.json
          git diff --cached --quiet && exit 0
          git commit -m "discover job boards $(date -u +%Y-%m-%d)"
          for i in 1 2 3; do git pull --rebase origin main && git push && break; sleep 5; done

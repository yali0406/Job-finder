name: probe
on: workflow_dispatch
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -q -r requirements.txt
      - run: |
          python - <<'PY'
          from scanner.sources import ats
          for k,s in [("bamboohr","solitics"),("bamboohr","glassesusa"),("bamboohr","vistairhr"),("bamboohr","evergreenfinance"),("bamboohr","structureit"),("bamboohr","prominentedge"),("ashby","act-security"),("ashby","matia"),("ashby","como"),("ashby","whippy"),("ashby","gr8-tech"),("ashby","toogeza")]:
              try: js=ats.FETCHERS[k](s,s) or []
              except Exception as e: js=[]; print(s,"ERR",e)
              print("LOC", s, sorted({j.location for j in js})[:8])
          PY

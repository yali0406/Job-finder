name: probe
on: workflow_dispatch
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -q -r requirements.txt
      - run: |
          python - <<'PY'
          import requests
          from scanner.common import UA
          u="https://lnw.wd5.myworkdayjobs.com/wday/cxs/lnw/SciPlayExternalCareersSite/jobs"
          body={"appliedFacets":{},"limit":20,"offset":0,"searchText":""}
          for name,h in [("none",{}),("scannerUA",{"User-Agent":UA}),("lang",{"Accept-Language":"en-US,en;q=0.9,he;q=0.8"}),("both",{"User-Agent":UA,"Accept-Language":"en-US,en;q=0.9,he;q=0.8"}),("both+accept",{"User-Agent":UA,"Accept-Language":"en-US","Accept":"application/json"})]:
              r=requests.post(u,json=body,headers=h,timeout=20); print(name,r.status_code)
          r=requests.post(u,json=dict(body,searchText="Israel"),timeout=20); print("Israel",r.status_code,r.text[:150])
          PY

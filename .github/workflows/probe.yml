name: probe
on: workflow_dispatch
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -q -r requirements.txt
      - run: |
          python - <<'PY'
          import yaml
          from scanner.sources.ats import _workday, fetch_description
          cfg=yaml.safe_load(open("sources.yaml"))
          for c in cfg["companies"]+cfg.get("gaming",[]):
              if isinstance(c,dict) and c.get("ats")=="workday":
                  j=_workday(c["slug"],c["name"])
                  print(c["name"], None if j is None else len(j), [x.title for x in (j or [])][:3], flush=True)
                  if j and c["name"]=="SciPlay":
                      fetch_description(j[0]); print("  desc len", len(j[0].description or ""))
          PY

name: probe
on: workflow_dispatch
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -q -r requirements.txt
      - run: |
          python - <<'PY'
          from scanner.sources import ats
          from scanner.common import in_israel
          for k,s in [("recruitee","ontarget"),("workable","sideinc"),("lever","tsmg"),("smartrecruiters","sapitbusinesssysteme"),("workable","humanz"),("workable","keywords-intl1"),("smartrecruiters","tapi"),("workable","huzzle"),("lever","z1tech"),("lever","vrchat"),("lever","zencore")]:
              try: js=ats.FETCHERS[k](s,s) or []
              except Exception as e: js=[]
              il=[j for j in js if in_israel(j.location)]
              print("LOC", s, sorted({j.location for j in il})[:4], [j.title for j in il][:3], sorted({j.location for j in js})[:4])
          PY

name: probe
on: workflow_dispatch
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - run: npm i playwright@1.48.2 && npx playwright install --with-deps chromium
      - run: |
          cat > t.js <<'JS'
          const { chromium } = require('playwright');
          (async () => {
            const b = await chromium.launch(); const U = 'https://job-finder-d29.pages.dev/';
            const A = await (await b.newContext()).newPage(); await A.goto(U); await A.waitForSelector('button[data-mark]');
            await A.waitForTimeout(3000);
            console.log('A button:', await A.textContent('#syncBtn'));
            const id = await A.getAttribute('button[data-mark="applied"]', 'data-id');
            await A.click(`button[data-id="${id}"][data-mark="applied"]`); await A.waitForTimeout(4000);
            const code = await A.evaluate(() => JSON.parse(localStorage.getItem(Object.keys(localStorage).find(k => k.toLowerCase().includes('synccode')))));
            await A.click('#syncBtn'); console.log('A panel has share:', !!(await A.$('#syncShare')));
            const B = await (await b.newContext()).newPage(); await B.goto(U + '#sync=' + code); await B.waitForSelector('button[data-mark]');
            await B.waitForTimeout(5000);
            console.log('B url hash cleared:', !B.url().includes('sync='));
            console.log('B sees applied:', (await B.textContent(`button[data-id="${id}"][data-mark="applied"]`)).includes('✓'));
            await b.close();
          })().catch(e => { console.error(e); process.exit(1); });
          JS
          node t.js

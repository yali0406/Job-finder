name: probe
on: workflow_dispatch
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - run: npm i playwright@1.48.2 && npx playwright install --with-deps chromium
      - run: |
          cat > t.js <<'JS'
          const { chromium } = require('playwright');
          (async () => {
            const b = await chromium.launch(); const U = 'https://job-finder-d29.pages.dev/';
            const A = await (await b.newContext()).newPage(); await A.goto(U); await A.waitForSelector('button[data-mark]'); await A.waitForTimeout(4000);
            const ids = await A.$$eval('button[data-mark="saved"]', bs => bs.filter(b => !b.classList.contains('on')).map(b => b.dataset.id));
            const id = ids[ids.length - 1];
            await A.click(`button[data-id="${id}"][data-mark="saved"]`); await A.waitForTimeout(4000);
            const B = await (await b.newContext()).newPage(); await B.goto(U); await B.waitForSelector('button[data-mark]'); await B.waitForTimeout(5000);
            const sel = `button[data-id="${id}"][data-mark="saved"]`;
            console.log('RESULT B sees saved without link:', (await B.textContent(sel)).includes('✓'));
            await B.click(sel); await B.waitForTimeout(4000);  // undo the test mark
            await A.reload(); await A.waitForSelector('button[data-mark]'); await A.waitForTimeout(5000);
            console.log('RESULT undo reached A:', !(await A.textContent(sel)).includes('✓'));
            await b.close();
          })().catch(e => { console.error(e); process.exit(1); });
          JS
          node t.js

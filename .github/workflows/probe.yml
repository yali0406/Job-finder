name: probe
on: workflow_dispatch
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          python3 - <<'PY'
          import urllib.request, json, time
          def go(t,w,s):
              req=urllib.request.Request(f"https://{t}.{w}.myworkdayjobs.com/wday/cxs/{t}/{s}/jobs",data=json.dumps({"appliedFacets":{},"limit":20,"offset":0,"searchText":"Israel"}).encode(),headers={"Content-Type":"application/json","Accept":"application/json"})
              try:
                  r=urllib.request.urlopen(req,timeout=20); return r.status, None
              except urllib.error.HTTPError as e: return e.code, dict(e.headers)
          st,h=go("nvidia","wd5","NVIDIAExternalCareerSite"); print("first",st,h,flush=True)
          for d in (2,5,10,20,40):
              time.sleep(d); st,h=go("nvidia","wd5","NVIDIAExternalCareerSite"); print("after",d,st,flush=True)
          PY

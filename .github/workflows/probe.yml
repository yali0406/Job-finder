name: probe
on: workflow_dispatch
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -q -r requirements.txt
      - run: |
          python - <<'PY'
          from scanner.common import post
          from scanner.sources.ats import _workday
          u="https://lnw.wd5.myworkdayjobs.com/wday/cxs/lnw/SciPlayExternalCareersSite/jobs"
          for st in ("Israel",""):
              r=post(u,json={"appliedFacets":{},"limit":20,"offset":0,"searchText":st})
              print(repr(st), r and r.status_code, r and r.text[:200])
          j=_workday("lnw|wd5|SciPlayExternalCareersSite","SciPlay"); print(j and len(j), j and [x.title for x in j])
          PY

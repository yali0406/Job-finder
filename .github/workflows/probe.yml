name: probe
on: workflow_dispatch
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements.txt
      - run: python -m scanner.probe
      - if: always()
        run: |
          git config user.name probe; git config user.email probe@users.noreply.github.com
          git checkout -b probe-results
          git add -f probe_out.json && git commit -qm "probe results" && git push -f origin probe-results

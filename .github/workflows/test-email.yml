name: test email

# Sends the current top jobs by email once, to check the Gmail secrets.
on: workflow_dispatch

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}
        run: |
          python - <<'PY'
          import json, logging
          from scanner.notify import send_digest
          logging.basicConfig(level=logging.INFO)
          jobs = sorted(json.load(open("docs/data/jobs.json"))["jobs"], key=lambda j: -(j.get("score") or 0))[:3]
          send_digest(jobs, "https://job-finder-d29.pages.dev")
          PY

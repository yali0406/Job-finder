name: setup sync
# One-time: creates the D1 database for syncing marks between devices (needs the Cloudflare token
# to have Account > D1 > Edit), applies the schema, and prints the database id for wrangler.toml.
on: workflow_dispatch
permissions:
  contents: read
jobs:
  setup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sync
      - name: Create the database (or find it)
        id: db
        run: |
          id=$(npx --yes wrangler@4 d1 list --json | jq -r '.[] | select(.name=="job-finder") | .uuid')
          if [ -z "$id" ]; then
            npx --yes wrangler@4 d1 create job-finder
            id=$(npx --yes wrangler@4 d1 list --json | jq -r '.[] | select(.name=="job-finder") | .uuid')
          fi
          test -n "$id"
          echo "DATABASE_ID=$id"
          echo "id=$id" >> "$GITHUB_OUTPUT"
      - name: Apply the schema
        run: |
          sed -i "s/00000000-0000-0000-0000-000000000000/${{ steps.db.outputs.id }}/" wrangler.toml
          npx --yes wrangler@4 d1 migrations apply job-finder --remote

# VC portfolio job boards (Getro). Each covers dozens to hundreds of Israeli startups.
vc_boards:
  # seed / early-stage funds: jobs here are treated as startups (broader "foot in the door" roles)
  - {url: https://jobs.tlv.partners, early_stage: true}        # verified Getro
  - {url: https://careers.grovevc.com, early_stage: true}      # verified Getro
  - {url: https://jobs.ibexinvestors.com, early_stage: true}
  - https://careers.viola-group.com  # verified
  - https://jobs.vertexventures.co.il

# General Israeli job sites (good for analyst / PM roles outside startups)
